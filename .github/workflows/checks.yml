name: Reproduction checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  records-and-routing:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements.txt
      - run: python scripts/check_data.py
      - run: python scripts/reproduce_results.py
      - run: python routing/build.py
      - run: python scripts/plot_results.py
